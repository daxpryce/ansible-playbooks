---
- name: Import the Task repository signing key
  become: true
  ansible.builtin.rpm_key:
    key: "{{ task_repo_gpgkey }}"
    state: present

# Written before the repository itself so a machine set up by the old Cloudsmith
# script converges on the same three-section-free file.
- name: Remove the empty Task sub-repositories
  become: true
  ansible.builtin.yum_repository:
    name: "{{ item }}"
    file: "{{ task_repo_file }}"
    state: absent
  loop: "{{ task_repo_stale_repos }}"

- name: Configure the Task dnf repository
  become: true
  ansible.builtin.yum_repository:
    name: "{{ task_repo_name }}"
    file: "{{ task_repo_file }}"
    description: Task, published through Cloudsmith
    baseurl: "{{ task_repo_baseurl }}"
    gpgkey: "{{ task_repo_gpgkey }}"
    gpgcheck: true
    # dnf5 keeps repomd.xml signature verification keys in its own keybox,
    # separate from the rpm keyring that rpm_key (above) populates and that
    # package-level gpgcheck uses. Nothing here can answer dnf5's interactive
    # "Importing OpenPGP key ... Is this ok" prompt for that keybox, so
    # repo_gpgcheck fails every run and skip_if_unavailable silently drops
    # this repo, falling back to Fedora's own "task" (Taskwarrior) package of
    # the same name. Packages are still verified via gpgcheck.
    repo_gpgcheck: false
    # A third-party repo should not be able to block a system-wide upgrade.
    skip_if_unavailable: true
    # Cloudsmith's script set 300s, which re-fetches metadata on almost every
    # dnf invocation. Task releases nothing like that often.
    metadata_expire: 6h
    enabled: true
    state: present

- name: Install the Task runner
  become: true
  ansible.builtin.dnf:
    name: task
    state: present
