---
- name: Read the interactively enrolled credentials
  ansible.builtin.slurp:
    src: "{{ yubikey_pam_registration_file }}"
  register: yubikey_pam_registration
  no_log: true

- name: Require a single registration line for the intended account
  ansible.builtin.assert:
    that:
      - yubikey_pam_registration.content | b64decode | trim is match('^' ~ yubikey_pam_user ~ ':')
      - yubikey_pam_registration.content | b64decode | trim | split('\n') | length == 1
      - >-
        yubikey_pam_registration.content | b64decode | trim is
        match('^[^:]+:(?:[^,:\s]+,[^,:\s]+,[^,:\s]+,[^:\s]*)(?::[^,:\s]+,[^,:\s]+,[^,:\s]+,[^:\s]*)*$')
    fail_msg: >-
      Enroll a FIDO2 key with pamu2fcfg -N as the intended user first.
      The registration file must contain one username and one or more credentials.

# Persistent labeling is needed for confined login processes on enforcing Fedora.
- name: Label the central credential directory persistently
  become: true
  community.general.sefcontext:
    target: /etc/security/yubikey-pam(/.*)?
    setype: auth_home_t
    state: present
  when: ansible_facts['selinux']['status'] == 'enabled'

# Cinnamon's PAM helper runs unprivileged. These are public credentials, not
# private keys or PINs; root ownership, rather than secrecy, protects integrity.
- name: Create the root-owned credential directory
  become: true
  ansible.builtin.file:
    path: /etc/security/yubikey-pam
    state: directory
    owner: root
    group: root
    mode: "0755"
    setype: "{{ 'auth_home_t' if ansible_facts['selinux']['status'] == 'enabled' else omit }}"

- name: Install this user's mapping without replacing other users
  become: true
  ansible.builtin.lineinfile:
    path: /etc/security/yubikey-pam/u2f_keys
    regexp: "^{{ yubikey_pam_user | regex_escape }}:"
    line: "{{ yubikey_pam_registration.content | b64decode | trim }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    setype: "{{ 'auth_home_t' if ansible_facts['selinux']['status'] == 'enabled' else omit }}"
    backup: true
  diff: false
