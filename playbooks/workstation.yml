---
# Full workstation build. Roles are ordered so that repositories and shell
# plumbing land before the things that depend on them; meta/main.yml
# dependencies keep the directed single-role playbooks correct on their own.
- name: Provision a Fedora workstation
  hosts: workstations
  gather_facts: true
  roles:
    # ── Repositories and shell plumbing ──
    - rpmfusion
    - bashrcd

    # ── System maintenance ──
    # After rpmfusion, so unattended upgrades cover it from the first run.
    - dnf_automatic

    # ── Command line tooling ──
    - git
    - vim
    - jq
    - just
    - task
    - tealdeer
    - bottom
    - starship

    # ── Remote access ──
    - sshd
    - role: yubikey_pam
      when: yubikey_pam_enabled | default(false) | bool

    # ── Language toolchains ──
    - golang
    - rust

    # ── Containers ──
    - podman

    # ── Desktop applications ──
    - wezterm
    - vscode
    - discord
    - zen_browser
    - zen_browser_extensions
    - zen_browser_policies

    # ── Desktop look and feel ──
    - nerd_fonts_hack
    - catppuccin_gnome_terminal
    - no_notifications
    - dark_mode
